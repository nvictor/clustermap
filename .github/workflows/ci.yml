name: Build and Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Test core
        run: swift test --package-path ClustermapCore -c release
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Clustermap/Clustermap.xcodeproj -scheme Clustermap \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build
